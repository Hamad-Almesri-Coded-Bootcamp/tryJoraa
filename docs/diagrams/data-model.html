<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The eight tables</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 980px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER / Data model · Jur'ah</p>
    <h1>The eight tables, and what one row of each is</h1>

    <svg viewBox="0 0 1140 740" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="data-model-title data-model-desc">
      <title id="data-model-title">The eight tables of Jur'ah</title>
      <desc id="data-model-desc">Data model centred on prescriptions: a profile is a doctor or a patient, care links join them, a prescription names one medication for one patient, doses are its scheduled times, runs record each press of the check button, and alerts record what the agent refused to do. Interactions is a public reference table pairing two medications with a minimum gap.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ RELATIONSHIP LINES (drawn first) ============ -->

      <!-- 1. profiles — prescriptions -->
      <line x1="260" y1="320" x2="460" y2="320" stroke="#4f5d75" stroke-width="1.2"/>

      <text x="170" y="384" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">1</text>
      <text x="170" y="496" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace">N</text>
      <rect x="170" y="429" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="192" y="438" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LINKS</text>

      <text x="614" y="225" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">IS FOR</text>

      <text x="828" y="316" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">N</text>
