<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How the agent decides</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Jur'ah</p>
    <h1>How the agent decides a missed dose</h1>

    <svg viewBox="0 0 1000 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-decision-title agent-decision-desc">
      <title id="agent-decision-title">How the agent decides a missed dose</title>
      <desc id="agent-decision-desc">Decision flow for a missed medication dose: an unverified medicine profile, a time-critical medicine, being more than two hours late on a frequently-taken medicine, or an interaction clash each refuse and alert the doctor; only a dose that clears all four checks is proposed to the patient.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ARROWS FIRST (z-order: behind nodes) ============ -->

      <!-- start -> D1 -->
      <line x1="360" y1="76" x2="360" y2="106" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- D1 NO -> refuse (horizontal, y=156) -->
      <line x1="460" y1="156" x2="694" y2="156" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="556" y="136" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="571" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- D1 YES -> D2 -->
      <line x1="360" y1="200" x2="360" y2="222" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="370" y="205" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="385" y="214" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- D2 YES -> refuse (horizontal, y=272) -->
      <line x1="460" y1="272" x2="694" y2="272" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="556" y="252" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="571" y="261" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- D2 NO -> D3 -->
      <line x1="360" y1="316" x2="360" y2="338" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="370" y="321" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="385" y="330" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- D3 YES -> bypass D4, down the left to D5 (orthogonal, r=8) -->
      <path d="M 260 388 L 188 388 Q 180 388 180 396 L 180 612 Q 180 620 188 620 L 252 620"
            fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="140" y="482" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="155" y="491" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- D3 NO -> D4 -->
      <line x1="360" y1="432" x2="360" y2="454" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="370" y="437" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="385" y="446" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- D4 NO -> refuse (horizontal, y=504) -->
      <line x1="460" y1="504" x2="694" y2="504" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="556" y="484" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="571" y="493" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- D4 YES -> D5 -->
      <line x1="360" y1="548" x2="360" y2="570" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="370" y="553" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="385" y="562" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- D5 YES -> refuse (horizontal, y=620) -->
      <line x1="460" y1="620" x2="694" y2="620" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="556" y="600" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="571" y="609" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- D5 NO -> propose (the happy path — accent) -->
      <line x1="360" y1="664" x2="360" y2="690" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
      <rect x="370" y="671" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="385" y="680" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- ============ NODES ============ -->

      <!-- START: missed dose -->
      <rect x="264" y="36" width="192" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="264" y="36" width="192" height="40" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="360" y="61" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A dose was missed</text>

      <!-- D1 -->
      <polygon points="360,112 460,156 360,200 260,156" fill="#f5f5f5"/>
      <polygon points="360,112 460,156 360,200 260,156" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="152" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Is the medicine</text>
      <text x="360" y="167" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">profile verified?</text>

      <!-- D2 -->
      <polygon points="360,228 460,272 360,316 260,272" fill="#f5f5f5"/>
      <polygon points="360,228 460,272 360,316 260,272" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="268" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Time-critical</text>
      <text x="360" y="283" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">medicine?</text>

      <!-- D3 -->
      <polygon points="360,344 460,388 360,432 260,388" fill="#f5f5f5"/>
      <polygon points="360,344 460,388 360,432 260,388" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="384" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Two hours late</text>
      <text x="360" y="399" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">or less?</text>

      <!-- D4 -->
      <polygon points="360,460 460,504 360,548 260,504" fill="#f5f5f5"/>
      <polygon points="360,460 460,504 360,548 260,504" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="495" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Twice a day or less,</text>
      <text x="360" y="510" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">and the next dose</text>
      <text x="360" y="525" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">is over 4h away?</text>

      <!-- D5 -->
      <polygon points="360,576 460,620 360,664 260,620" fill="#f5f5f5"/>
      <polygon points="360,576 460,620 360,664 260,620" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="616" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Clashes with</text>
      <text x="360" y="631" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">another medicine?</text>

      <!-- REFUSE — tall collector terminal on the right -->
      <rect x="700" y="112" width="220" height="556" rx="20" fill="#f5f5f5"/>
      <rect x="700" y="112" width="220" height="556" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="712" y="124" width="60" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="742" y="133" fill="rgba(79,93,117,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTCOME</text>
      <text x="810" y="372" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Refuse</text>
      <text x="810" y="394" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">and alert the doctor</text>
      <text x="810" y="420" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no dose is moved</text>

      <!-- PROPOSE — focal -->
      <rect x="240" y="690" width="240" height="44" rx="20" fill="#f5f5f5"/>
      <rect x="240" y="690" width="240" height="44" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="360" y="710" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Propose a new time</text>
      <text x="360" y="726" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">patient must accept</text>

      <!-- ============ LEGEND ============ -->
      <line x1="30" y1="772" x2="970" y2="772" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="790" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <polygon points="118,786 132,793 118,800 104,793" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="142" y="796" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">DECISION</text>

      <rect x="282" y="786" width="28" height="14" rx="7" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="320" y="796" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">START</text>

      <rect x="440" y="786" width="28" height="14" rx="7" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="478" y="796" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">REFUSAL</text>

      <rect x="620" y="786" width="28" height="14" rx="7" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="658" y="796" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">PROPOSAL — THE ONLY PATH THAT MOVES A DOSE</text>
    </svg>
  </div>
</body>
</html>
