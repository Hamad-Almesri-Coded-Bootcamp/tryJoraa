<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How work reaches main</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #eb6c36;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Jur'ah</p>
    <h1>How work reaches <code style="font-family:var(--font-mono);font-size:0.8em">main</code></h1>

    <svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ship-loop-title ship-loop-desc">
      <title id="ship-loop-title">How work reaches main</title>
      <desc id="ship-loop-desc">A lane owner builds and tests a task, the reviewer subagent must clear the branch before a pull request opens, the boss session's integrator must clear the pull request before it is squash-merged, and all three gates must pass afterwards or the merge is reverted immediately; any failure sends the work back to the lane that owns it.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ARROWS ============ -->

      <line x1="360" y1="76" x2="360" y2="112" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="360" y1="168" x2="360" y2="200" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- D3 NO -> collector -->
      <line x1="470" y1="250" x2="694" y2="250" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="567" y="230" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="582" y="239" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- D3 YES -> step4 -->
      <line x1="360" y1="296" x2="360" y2="322" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="370" y="303" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="385" y="312" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <line x1="360" y1="378" x2="360" y2="410" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- D5 NO -> collector -->
      <line x1="470" y1="460" x2="694" y2="460" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="567" y="440" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="582" y="449" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <!-- D5 YES -> step6 -->
      <line x1="360" y1="506" x2="360" y2="532" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="370" y="513" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="385" y="522" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <line x1="360" y1="588" x2="360" y2="620" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- D7 NO -> collector -->
      <line x1="470" y1="670" x2="694" y2="670" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="543" y="650" width="78" height="12" rx="2" fill="#f5f5f5"/>
      <text x="582" y="659" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO — REVERT</text>

      <!-- D7 YES -> live -->
      <line x1="360" y1="716" x2="360" y2="746" stroke="#eb6c36" stroke-width="1.8" marker-end="url(#arrow-accent)"/>
      <rect x="370" y="725" width="30" height="12" rx="2" fill="#f5f5f5"/>
      <text x="385" y="734" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <!-- ============ NODES ============ -->

      <!-- START -->
      <rect x="240" y="36" width="240" height="40" rx="20" fill="#f5f5f5"/>
      <rect x="240" y="36" width="240" height="40" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="360" y="61" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A lane owner types /work</text>

      <!-- STEP 2 -->
      <rect x="240" y="116" width="240" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="116" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="139" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Build · test · show output</text>
      <text x="360" y="156" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">then the reviewer subagent</text>

      <!-- D3 -->
      <polygon points="360,204 470,250 360,296 250,250" fill="#f5f5f5"/>
      <polygon points="360,204 470,250 360,296 250,250" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="246" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reviewer says</text>
      <text x="360" y="261" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SAFE TO MERGE?</text>

      <!-- STEP 4 -->
      <rect x="240" y="326" width="240" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="326" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="349" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Commit, push, open the PR</text>
      <text x="360" y="366" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">under the owner's own name</text>

      <!-- D5 -->
      <polygon points="360,414 470,460 360,506 250,460" fill="#f5f5f5"/>
      <polygon points="360,414 470,460 360,506 250,460" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="456" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/ship — integrator</text>
      <text x="360" y="471" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">clears it?</text>

      <!-- STEP 6 -->
      <rect x="240" y="536" width="240" height="52" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="536" width="240" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="559" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Squash-merge to main</text>
      <text x="360" y="576" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wait for Vercel: Ready</text>

      <!-- D7 -->
      <polygon points="360,624 470,670 360,716 250,670" fill="#f5f5f5"/>
      <polygon points="360,624 470,670 360,716 250,670" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="661" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">build · verify:rls</text>
      <text x="360" y="676" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">verify:ui — all three</text>
      <text x="360" y="691" fill="#2d3142" font-size="11.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">green?</text>

      <!-- COLLECTOR -->
      <rect x="700" y="204" width="220" height="512" rx="20" fill="#f5f5f5"/>
      <rect x="700" y="204" width="220" height="512" rx="20" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="712" y="216" width="60" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="742" y="225" fill="rgba(79,93,117,0.85)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUTCOME</text>
      <text x="810" y="440" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Back to the lane</text>
      <text x="810" y="462" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">that owns it</text>
      <text x="810" y="488" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">main is never left broken</text>

      <!-- END -->
      <rect x="220" y="746" width="280" height="44" rx="20" fill="#f5f5f5"/>
      <rect x="220" y="746" width="280" height="44" rx="20" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="360" y="766" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Live, and the checklist ticked</text>
      <text x="360" y="782" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">every 45 minutes, 08:00–23:00</text>

      <!-- ============ LEGEND ============ -->
      <line x1="30" y1="832" x2="970" y2="832" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="850" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <polygon points="118,846 132,853 118,860 104,853" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="142" y="856" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">GATE — NOBODY MAY SKIP ONE</text>

      <rect x="420" y="846" width="28" height="14" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="458" y="856" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">BLOCKED</text>

      <rect x="600" y="846" width="28" height="14" rx="7" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="638" y="856" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">SHIPPED — THE ONLY WAY ANYTHING GOES LIVE</text>
    </svg>
  </div>
</body>
</html>
