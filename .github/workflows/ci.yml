# Goes in the repo at .github/workflows/ci.yml
#
# This is the gate that replaces a human clicking "Approve". Branch protection
# requires this check to pass and requires ZERO approving reviews — because the
# boss cannot approve its own pull request, and a rule that needs one approval
# deadlocks the whole loop on Monday morning.
#
# Secrets to set once, from the lead's machine:
#   gh secret set NEXT_PUBLIC_SUPABASE_URL      < <(echo "$URL")
#   gh secret set NEXT_PUBLIC_SUPABASE_ANON_KEY < <(echo "$ANON")
#   gh secret set RLS_TEST_A_EMAIL ...  RLS_TEST_A_PASSWORD ...
#   gh secret set RLS_TEST_B_EMAIL ...  RLS_TEST_B_PASSWORD ...
#   gh secret set RLS_TEST_DOCTOR_LINKED_EMAIL ...    RLS_TEST_DOCTOR_LINKED_PASSWORD ...
#   gh secret set RLS_TEST_DOCTOR_UNLINKED_EMAIL ...  RLS_TEST_DOCTOR_UNLINKED_PASSWORD ...
#
# The service role key is NOT a CI secret. Neither `npm run build` nor
# `npm run verify:rls` needs it: server code reads secrets inside the handler,
# and verify-rls runs on the anon key only. It lives in the lead's .env.local
# and in n8n. Nowhere else — the judge searches the commit history, and the
# pre-commit hook is what protects that.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      RLS_TEST_A_EMAIL: ${{ secrets.RLS_TEST_A_EMAIL }}
      RLS_TEST_A_PASSWORD: ${{ secrets.RLS_TEST_A_PASSWORD }}
      RLS_TEST_B_EMAIL: ${{ secrets.RLS_TEST_B_EMAIL }}
      RLS_TEST_B_PASSWORD: ${{ secrets.RLS_TEST_B_PASSWORD }}
      RLS_TEST_DOCTOR_LINKED_EMAIL: ${{ secrets.RLS_TEST_DOCTOR_LINKED_EMAIL }}
      RLS_TEST_DOCTOR_LINKED_PASSWORD: ${{ secrets.RLS_TEST_DOCTOR_LINKED_PASSWORD }}
      RLS_TEST_DOCTOR_UNLINKED_EMAIL: ${{ secrets.RLS_TEST_DOCTOR_UNLINKED_EMAIL }}
      RLS_TEST_DOCTOR_UNLINKED_PASSWORD: ${{ secrets.RLS_TEST_DOCTOR_UNLINKED_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 1. No secret may reach the browser bundle. This is a MUST item and it
      #    is cheaper to fail here than to have a judge find it.
      - name: no service role key in client code
        run: |
          if grep -rn "SUPABASE_SERVICE_ROLE_KEY" src/app/\(app\) src/components 2>/dev/null; then
            echo "::error::service role key referenced in client code"; exit 1
          fi
          if grep -rn "NEXT_PUBLIC_SUPABASE_SERVICE" src 2>/dev/null; then
            echo "::error::service role key exposed via NEXT_PUBLIC_"; exit 1
          fi
          if grep -rn "webhook-test" src n8n 2>/dev/null; then
            echo "::error::n8n TEST webhook url in the repo — must be the production url"; exit 1
          fi
          if grep -rln "SUPABASE_SERVICE_ROLE_KEY" scripts/verify-rls.ts 2>/dev/null; then
            echo "::error::verify-rls.ts must never reference the service role key"; exit 1
          fi
          echo "clean"

      - run: npm run build

      # 2. Account B cannot reach account A's rows. The gate that decides
      #    whether we pass on Thursday.
      - run: npm run verify:rls
